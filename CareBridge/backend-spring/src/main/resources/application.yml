spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:file:.env[.properties]
  application:
    name: MediVault
  
  # Base database configuration (Overridden by profiles)
  datasource:
    driver-class-name: org.postgresql.Driver
  
  # JPA Configuration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # STRICTLY NO AUTO SCHEMA CREATION. We use Flyway.
    properties:
      hibernate:
        format_sql: true
        generate_statistics: false
  
  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when_authorized
  
# Application Specific Properties
medivault:
  security:
    jwt:
      secret: ${JWT_SECRET:defaultSecretKeyThatIsAtLeast32BytesLongForSecurityHS256Algorithm}
      expiration-ms: 900000 # 15 minutes
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

# Springdoc OpenAPI Custom Styling (Medical Blue Palette)
springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    custom-css: |
      @import url('/swagger-ui-custom.css');

